name: Update PM Jobs Feed & Trigger Live Build

on:
  schedule:
    # Runs every 2 hours (0:00, 2:00, 4:00, 6:00, 8:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual one-click trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Job Aggregator Scraper
        run: |
          python scripts/scraper.py

      - name: Commit and Push Updated Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage both data paths
          git add public/data/jobs.json data/jobs.json || true
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No new changes in jobs.json. Feed is up to date."
          else
            echo "New PM job updates detected. Committing and pushing to main branch..."
            git commit -m "chore(data): automated 2-hour PM jobs update [skip ci]"
            git push origin main
            echo "Successfully pushed updated jobs to main. Netlify deployment triggered automatically!"
          fi
